<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Component map in four layers: ingress adapters for websocket, mempool REST, wallet balances, Bitaxe and block rewards; the orchestrator in mempaper_app.py holding precache, prerender, block lock and config state; the rendering layer in image_renderer.py producing paired web and e-ink images alongside the encrypted cache; and the output layer of SocketIO to browsers plus a persistent display worker subprocess.">
<style>
  svg { font-family: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }

  .f-t{fill:#1A1A1F} .f-t2{fill:#5C5C66} .f-t3{fill:#8A8A94}
  .f-btc{fill:#B7791F} .f-lan{fill:#1D6B2C} .f-auth{fill:#2C5AA8}
  .f-exp{fill:#C62828} .f-tor{fill:#6B3FA0}

  .zone{fill:none;stroke-width:1.5;stroke-dasharray:7 5}
  .zone-lan{fill:rgba(29,107,44,0.09);stroke:#1D6B2C}
  .zone-exp{fill:rgba(198,40,40,0.08);stroke:#C62828}
  .zone-net{fill:#F2F0EC;stroke:#DAD6CE}
  .zone-tor{fill:rgba(107,63,160,0.10);stroke:#6B3FA0}
  .zone-auth{fill:rgba(44,90,168,0.09);stroke:#2C5AA8}

  .bx{fill:#FFFFFF;stroke:#1A1A1F;stroke-width:1.6}
  .bx-soft{fill:#FFFFFF;stroke:#DAD6CE;stroke-width:1.6}
  .bx-2{fill:#F2F0EC;stroke:#DAD6CE;stroke-width:1.4}
  .bx-in{fill:#FFFFFF;stroke:#DAD6CE;stroke-width:1.2}
  .bx-btc{fill:rgba(183,121,31,0.10);stroke:#B7791F;stroke-width:2.4}
  .bx-lan{fill:rgba(29,107,44,0.09);stroke:#1D6B2C;stroke-width:1.9}
  .bx-auth{fill:rgba(44,90,168,0.09);stroke:#2C5AA8;stroke-width:2}
  .bx-exp{fill:rgba(198,40,40,0.08);stroke:#C62828;stroke-width:1.6}
  .bx-tor{fill:rgba(107,63,160,0.10);stroke:#6B3FA0;stroke-width:2.2}
  .bx-o{fill:#FFFFFF;stroke:#C62828;stroke-width:2}
  .bx-g{fill:#FFFFFF;stroke:#1D6B2C;stroke-width:2}

  .ln{stroke:#1A1A1F;stroke-width:2;fill:none}
  .ln-thin{stroke:#DAD6CE;stroke-width:1;fill:none}
  /* fill:none matters on every one of these: the bracket paths are open
     outlines, and without it a browser fills them solid black. */
  .ln-btc{stroke:#B7791F;stroke-width:2;fill:none}
  .ln-tor{stroke:#6B3FA0;stroke-width:2.4;fill:none}
  .ln-exp{stroke:#C62828;stroke-width:2.4;fill:none}
  .ln-auth{stroke:#2C5AA8;stroke-width:2.3;fill:none}
  .ln-lan{stroke:#1D6B2C;stroke-width:2.2;fill:none}
  .ln-mut{stroke:#5C5C66;stroke-width:2;fill:none}
  .ln-dash{stroke:#8A8A94;stroke-width:1.6;fill:none;stroke-dasharray:5 4}
  .ln-sep{stroke:#E8E5DF;stroke-width:1;fill:none}

  .t-lg{font-size:25px;font-weight:700} .t-md{font-size:20px;font-weight:600}
  .t-sm{font-size:17px;font-weight:600} .t-xs{font-size:15px} .t-xxs{font-size:14px}
  .t-zone{font-size:18px;font-weight:600;letter-spacing:1.5px}
  .t-eyebrow{font-size:15px;font-weight:700;letter-spacing:1.4px}
  .mid{text-anchor:middle}
</style>
<rect x="0" y="0" width="100%" height="100%" fill="#FAF9F6"/>
<svg x="40" y="20" width="44" height="44" viewBox="0 0 64 64"><g transform="translate(0.00630876,-0.00301984)"><path fill="#1a1a1f" d="m63.033,39.744c-4.274,17.143-21.637,27.576-38.782,23.301-17.138-4.274-27.571-21.638-23.295-38.78,4.272-17.145,21.635-27.579,38.775-23.305,17.144,4.274,27.576,21.64,23.302,38.784z"/><path fill="#F7931A" d="m46.103,27.444c0.637-4.258-2.605-6.547-7.038-8.074l1.438-5.768-3.511-0.875-1.4,5.616c-0.923-0.23-1.871-0.447-2.813-0.662l1.41-5.653-3.509-0.875-1.439,5.766c-0.764-0.174-1.514-0.346-2.242-0.527l0.004-0.018-4.842-1.209-0.934,3.75s2.605,0.597,2.55,0.634c1.422,0.355,1.679,1.296,1.636,2.042l-1.638,6.571c0.098,0.025,0.225,0.061,0.365,0.117-0.117-0.029-0.242-0.061-0.371-0.092l-2.296,9.205c-0.174,0.432-0.615,1.08-1.609,0.834,0.035,0.051-2.552-0.637-2.552-0.637l-1.743,4.019,4.569,1.139c0.85,0.213,1.683,0.436,2.503,0.646l-1.453,5.834,3.507,0.875,1.439-5.772c0.958,0.26,1.888,0.5,2.798,0.726l-1.434,5.745,3.511,0.875,1.453-5.823c5.987,1.133,10.489,0.676,12.384-4.739,1.527-4.36-0.076-6.875-3.226-8.515,2.294-0.529,4.022-2.038,4.483-5.155zm-8.022,11.249c-1.085,4.36-8.426,2.003-10.806,1.412l1.928-7.729c2.38,0.594,10.012,1.77,8.878,6.317zm1.086-11.312c-0.99,3.966-7.1,1.951-9.082,1.457l1.748-7.01c1.982,0.494,8.365,1.416,7.334,5.553z"/></g></svg>
<text x="96" y="42" font-size="21" font-weight="700"><tspan fill="#1A1A1F">mem</tspan><tspan fill="#B7791F">paper</tspan></text>
<text x="96" y="64" font-size="15" fill="#5C5C66">Codebase component map</text>
<text x="1240" y="42" font-size="13" fill="#8A8A94" text-anchor="end">github.com/satcat21/btc-mempaper</text>
<text x="1240" y="63" font-size="13" fill="#8A8A94" text-anchor="end">2026</text>
<line x1="40" y1="80" x2="1240" y2="80" stroke="#DAD6CE" stroke-width="1"/>

          <defs>
            <marker id="m5t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-t"/></marker>
            <marker id="m5g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-lan"/></marker>
          </defs>

          <text x="40" y="130" class="t-eyebrow f-t3">INGRESS</text>
          <text x="40" y="302" class="t-eyebrow f-t3">ORCHESTRATE</text>
          <text x="40" y="474" class="t-eyebrow f-t3">RENDER</text>
          <text x="40" y="622" class="t-eyebrow f-t3">OUTPUT</text>
          <line x1="196" y1="96" x2="196" y2="670" class="ln-sep"/>

          <rect x="228" y="96" width="228" height="94" rx="7" class="bx"/>
          <text x="342" y="126" class="t-sm mid f-t">websocket_client</text>
          <text x="342" y="150" class="t-xxs mid f-t2">blocks subscription</text>
          <text x="342" y="172" class="t-xxs mid f-btc">→ fires new-block event</text>

          <rect x="480" y="96" width="212" height="94" rx="7" class="bx"/>
          <text x="586" y="126" class="t-sm mid f-t">mempool_api</text>
          <text x="586" y="150" class="t-xxs mid f-t2">fees · hashrate</text>
          <text x="586" y="172" class="t-xxs mid f-t2">prices · tip</text>

          <rect x="716" y="96" width="212" height="94" rx="7" class="bx"/>
          <text x="822" y="126" class="t-sm mid f-t">wallet_balance</text>
          <text x="822" y="150" class="t-xxs mid f-t2">local derivation</text>
          <text x="822" y="172" class="t-xxs mid f-t2">+ gap limit</text>

          <rect x="952" y="96" width="292" height="94" rx="7" class="bx"/>
          <text x="1098" y="126" class="t-sm mid f-t">bitaxe_api · block_monitor</text>
          <text x="1098" y="150" class="t-xxs mid f-t2">miner stats (LAN)</text>
          <text x="1098" y="172" class="t-xxs mid f-t2">coinbase reward scan</text>

          <rect x="228" y="234" width="1016" height="152" rx="9" class="bx-btc"/>
          <text x="252" y="266" class="t-md f-btc" font-size="20">mempaper_app.py</text>
          <text x="446" y="266" class="t-xxs f-t2">— Flask routes · SocketIO · all scheduling</text>

          <rect x="252" y="286" width="222" height="80" rx="6" class="bx-in"/>
          <text x="363" y="312" class="t-xs mid f-t" font-weight="600">_precache</text>
          <text x="363" y="334" class="t-xxs mid f-t2">price · fee · network</text>
          <text x="363" y="356" class="t-xxs mid f-t2">refreshed every 5 min</text>

          <rect x="498" y="286" width="222" height="80" rx="6" class="bx-in"/>
          <text x="609" y="312" class="t-xs mid f-t" font-weight="600">_prerendered</text>
          <text x="609" y="334" class="t-xxs mid f-t2">next-block image</text>
          <text x="609" y="356" class="t-xxs mid f-t2">held in RAM</text>

          <rect x="744" y="286" width="222" height="80" rx="6" class="bx-in"/>
          <text x="855" y="312" class="t-xs mid f-t" font-weight="600">block lock</text>
          <text x="855" y="334" class="t-xxs mid f-t2">dedupe + serialise</text>
          <text x="855" y="356" class="t-xxs mid f-t2">concurrent blocks</text>

          <rect x="990" y="286" width="230" height="80" rx="6" class="bx-in"/>
          <text x="1105" y="312" class="t-xs mid f-t" font-weight="600">config_manager</text>
          <text x="1105" y="334" class="t-xxs mid f-t2">watch · validate</text>
          <text x="1105" y="356" class="t-xxs mid f-t2">encrypted secrets</text>

          <rect x="228" y="430" width="600" height="112" rx="9" class="bx" stroke-width="2"/>
          <text x="252" y="462" class="t-md f-t" font-size="19">image_renderer.py</text>
          <text x="252" y="492" class="t-xxs f-t2">render_dual_images() → one layout, two outputs</text>
          <text x="252" y="518" class="t-xxs f-t2">meme + info blocks · colors resolved per target theme</text>

          <rect x="860" y="430" width="384" height="112" rx="9" class="bx-soft"/>
          <text x="884" y="462" class="t-sm f-t">unified_secure_cache</text>
          <text x="884" y="492" class="t-xxs f-t2">balances + reward state, encrypted at rest</text>
          <text x="884" y="518" class="t-xxs f-t2">RAM authoritative · flushed every 30 min</text>

          <rect x="228" y="586" width="380" height="94" rx="8" class="bx-lan"/>
          <text x="418" y="620" class="t-sm mid f-t" font-size="18">SocketIO → browsers</text>
          <text x="418" y="648" class="t-xxs mid f-t2">base64 PNG pushed instantly · no reload</text>

          <rect x="648" y="586" width="596" height="94" rx="8" class="bx" stroke-width="1.8"/>
          <text x="946" y="620" class="t-sm mid f-t" font-size="18">display_worker.py — persistent subprocess</text>
          <text x="946" y="648" class="t-xxs mid f-t2">JSON over stdin/stdout · driver stays loaded · saves ~10 s per block</text>

          <line x1="342" y1="190" x2="342" y2="228" class="ln" stroke-width="1.8" marker-end="url(#m5t)"/>
          <line x1="586" y1="190" x2="586" y2="228" class="ln" stroke-width="1.8" marker-end="url(#m5t)"/>
          <line x1="822" y1="190" x2="822" y2="228" class="ln" stroke-width="1.8" marker-end="url(#m5t)"/>
          <line x1="1098" y1="190" x2="1098" y2="228" class="ln" stroke-width="1.8" marker-end="url(#m5t)"/>
          <line x1="528" y1="386" x2="528" y2="424" class="ln" stroke-width="1.8" marker-end="url(#m5t)"/>
          <line x1="1052" y1="386" x2="1052" y2="424" class="ln" stroke-width="1.8" marker-end="url(#m5t)"/>
          <line x1="418" y1="542" x2="418" y2="580" class="ln-lan" stroke-width="1.8" marker-end="url(#m5g)"/>
          <line x1="700" y1="542" x2="770" y2="580" class="ln" stroke-width="1.8" marker-end="url(#m5t)"/>
        </svg>
