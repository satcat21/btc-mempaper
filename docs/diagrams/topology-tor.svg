<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Over Tor: mempaper splits its egress. Mempool traffic goes to a local Tor daemon on port 9050 and out through a circuit to the mempool.space onion service, so the operator sees a circuit rather than a home IP. Bitaxe traffic to a private LAN address bypasses the proxy entirely, because Tor cannot route to private addresses.">
<style>
  svg { font-family: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }

  .f-t{fill:#1A1A1F} .f-t2{fill:#5C5C66} .f-t3{fill:#8A8A94}
  .f-btc{fill:#B7791F} .f-lan{fill:#1D6B2C} .f-auth{fill:#2C5AA8}
  .f-exp{fill:#C62828} .f-tor{fill:#6B3FA0}

  .zone{fill:none;stroke-width:1.5;stroke-dasharray:7 5}
  .zone-lan{fill:rgba(29,107,44,0.09);stroke:#1D6B2C}
  .zone-exp{fill:rgba(198,40,40,0.08);stroke:#C62828}
  .zone-net{fill:#F2F0EC;stroke:#DAD6CE}
  .zone-tor{fill:rgba(107,63,160,0.10);stroke:#6B3FA0}
  .zone-auth{fill:rgba(44,90,168,0.09);stroke:#2C5AA8}

  .bx{fill:#FFFFFF;stroke:#1A1A1F;stroke-width:1.6}
  .bx-soft{fill:#FFFFFF;stroke:#DAD6CE;stroke-width:1.6}
  .bx-2{fill:#F2F0EC;stroke:#DAD6CE;stroke-width:1.4}
  .bx-in{fill:#FFFFFF;stroke:#DAD6CE;stroke-width:1.2}
  .bx-btc{fill:rgba(183,121,31,0.10);stroke:#B7791F;stroke-width:2.4}
  .bx-lan{fill:rgba(29,107,44,0.09);stroke:#1D6B2C;stroke-width:1.9}
  .bx-auth{fill:rgba(44,90,168,0.09);stroke:#2C5AA8;stroke-width:2}
  .bx-exp{fill:rgba(198,40,40,0.08);stroke:#C62828;stroke-width:1.6}
  .bx-tor{fill:rgba(107,63,160,0.10);stroke:#6B3FA0;stroke-width:2.2}
  .bx-o{fill:#FFFFFF;stroke:#C62828;stroke-width:2}
  .bx-g{fill:#FFFFFF;stroke:#1D6B2C;stroke-width:2}

  .ln{stroke:#1A1A1F;stroke-width:2;fill:none}
  .ln-thin{stroke:#DAD6CE;stroke-width:1;fill:none}
  /* fill:none matters on every one of these: the bracket paths are open
     outlines, and without it a browser fills them solid black. */
  .ln-btc{stroke:#B7791F;stroke-width:2;fill:none}
  .ln-tor{stroke:#6B3FA0;stroke-width:2.4;fill:none}
  .ln-exp{stroke:#C62828;stroke-width:2.4;fill:none}
  .ln-auth{stroke:#2C5AA8;stroke-width:2.3;fill:none}
  .ln-lan{stroke:#1D6B2C;stroke-width:2.2;fill:none}
  .ln-mut{stroke:#5C5C66;stroke-width:2;fill:none}
  .ln-dash{stroke:#8A8A94;stroke-width:1.6;fill:none;stroke-dasharray:5 4}
  .ln-sep{stroke:#E8E5DF;stroke-width:1;fill:none}

  .t-lg{font-size:25px;font-weight:700} .t-md{font-size:20px;font-weight:600}
  .t-sm{font-size:17px;font-weight:600} .t-xs{font-size:15px} .t-xxs{font-size:14px}
  .t-zone{font-size:18px;font-weight:600;letter-spacing:1.5px}
  .t-eyebrow{font-size:15px;font-weight:700;letter-spacing:1.4px}
  .mid{text-anchor:middle}
</style>
<rect x="0" y="0" width="100%" height="100%" fill="#FAF9F6"/>
<svg x="40" y="20" width="44" height="44" viewBox="0 0 64 64"><g transform="translate(0.00630876,-0.00301984)"><path fill="#1a1a1f" d="m63.033,39.744c-4.274,17.143-21.637,27.576-38.782,23.301-17.138-4.274-27.571-21.638-23.295-38.78,4.272-17.145,21.635-27.579,38.775-23.305,17.144,4.274,27.576,21.64,23.302,38.784z"/><path fill="#F7931A" d="m46.103,27.444c0.637-4.258-2.605-6.547-7.038-8.074l1.438-5.768-3.511-0.875-1.4,5.616c-0.923-0.23-1.871-0.447-2.813-0.662l1.41-5.653-3.509-0.875-1.439,5.766c-0.764-0.174-1.514-0.346-2.242-0.527l0.004-0.018-4.842-1.209-0.934,3.75s2.605,0.597,2.55,0.634c1.422,0.355,1.679,1.296,1.636,2.042l-1.638,6.571c0.098,0.025,0.225,0.061,0.365,0.117-0.117-0.029-0.242-0.061-0.371-0.092l-2.296,9.205c-0.174,0.432-0.615,1.08-1.609,0.834,0.035,0.051-2.552-0.637-2.552-0.637l-1.743,4.019,4.569,1.139c0.85,0.213,1.683,0.436,2.503,0.646l-1.453,5.834,3.507,0.875,1.439-5.772c0.958,0.26,1.888,0.5,2.798,0.726l-1.434,5.745,3.511,0.875,1.453-5.823c5.987,1.133,10.489,0.676,12.384-4.739,1.527-4.36-0.076-6.875-3.226-8.515,2.294-0.529,4.022-2.038,4.483-5.155zm-8.022,11.249c-1.085,4.36-8.426,2.003-10.806,1.412l1.928-7.729c2.38,0.594,10.012,1.77,8.878,6.317zm1.086-11.312c-0.99,3.966-7.1,1.951-9.082,1.457l1.748-7.01c1.982,0.494,8.365,1.416,7.334,5.553z"/></g></svg>
<text x="96" y="42" font-size="21" font-weight="700"><tspan fill="#1A1A1F">mem</tspan><tspan fill="#B7791F">paper</tspan></text>
<text x="96" y="64" font-size="15" fill="#5C5C66">Topology D &#8212; mempool.space over Tor</text>
<text x="1240" y="42" font-size="13" fill="#8A8A94" text-anchor="end">github.com/satcat21/btc-mempaper</text>
<text x="1240" y="63" font-size="13" fill="#8A8A94" text-anchor="end">2026</text>
<line x1="40" y1="80" x2="1240" y2="80" stroke="#DAD6CE" stroke-width="1"/>

          <defs>
            <marker id="s5t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-t"/></marker>
            <marker id="s5p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-tor"/></marker>
            <marker id="s5g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-lan"/></marker>
          </defs>

          <rect x="36" y="92" width="606" height="590" rx="12" class="zone zone-lan"/>
          <text x="58" y="124" class="t-zone f-lan">YOUR HOME NETWORK</text>
          <rect x="686" y="92" width="376" height="590" rx="12" class="zone zone-tor"/>
          <text x="708" y="124" class="t-zone f-tor">TOR NETWORK</text>
          <rect x="1106" y="92" width="138" height="590" rx="12" class="zone zone-net"/>
          <text x="1126" y="124" class="t-zone f-t2">SERVICE</text>

          <rect x="62" y="182" width="130" height="92" rx="8" class="bx"/>
          <text x="127" y="218" class="t-sm mid f-t">Browser</text>
          <text x="127" y="246" class="t-xxs mid f-t2">LAN</text>

          <rect x="238" y="150" width="188" height="196" rx="9" class="bx-btc"/>
          <text x="332" y="192" class="t-lg mid f-btc">mempaper</text>
          <line x1="262" y1="210" x2="402" y2="210" class="ln-thin"/>
          <text x="332" y="238" class="t-xxs mid f-t">egress splits by</text>
          <text x="332" y="260" class="t-xxs mid f-t">destination:</text>
          <text x="332" y="290" class="t-xxs mid f-tor">mempool → proxy</text>
          <text x="332" y="316" class="t-xxs mid f-lan">LAN → direct</text>

          <line x1="192" y1="228" x2="230" y2="228" class="ln" marker-end="url(#s5t)"/>

          <!-- bitaxe direct (bypasses the proxy) -->
          <rect x="466" y="166" width="152" height="112" rx="8" class="bx-lan"/>
          <text x="542" y="204" class="t-sm mid f-t">Bitaxe</text>
          <text x="542" y="230" class="t-xxs mid f-t2">192.168.x.x</text>
          <text x="542" y="256" class="t-xxs mid f-lan">bypasses proxy</text>
          <line x1="426" y1="222" x2="458" y2="222" class="ln-lan" marker-end="url(#s5g)"/>

          <!-- e-ink, local -->
          <rect x="466" y="316" width="152" height="112" rx="8" class="bx"/>
          <text x="542" y="358" class="t-sm mid f-t">E-ink</text>
          <text x="542" y="386" class="t-xxs mid f-t2">SPI · local</text>
          <line x1="426" y1="330" x2="458" y2="360" class="ln" marker-end="url(#s5t)"/>

          <!-- tor daemon -->
          <rect x="238" y="404" width="188" height="126" rx="9" class="bx-tor"/>
          <text x="332" y="442" class="t-sm mid f-tor">tor daemon</text>
          <text x="332" y="470" class="t-xxs mid f-t2">SOCKS5 listener</text>
          <text x="332" y="496" class="t-xs mid f-tor">127.0.0.1:9050</text>
          <text x="332" y="520" class="t-xxs mid f-t2">same Pi</text>

          <line x1="332" y1="346" x2="332" y2="396" class="ln-tor" marker-end="url(#s5p)"/>
          <text x="348" y="378" class="t-xxs f-tor">socks5h</text>

          <!-- circuit -->
          <rect x="710" y="230" width="150" height="112" rx="8" class="bx-tor"/>
          <text x="785" y="268" class="t-sm mid f-tor">Guard</text>
          <text x="785" y="294" class="t-xxs mid f-t2">knows your IP,</text>
          <text x="785" y="316" class="t-xxs mid f-t2">not the target</text>

          <rect x="710" y="392" width="150" height="112" rx="8" class="bx-tor"/>
          <text x="785" y="430" class="t-sm mid f-tor">Middle</text>
          <text x="785" y="458" class="t-xxs mid f-t2">knows</text>
          <text x="785" y="480" class="t-xxs mid f-t2">neither end</text>

          <rect x="892" y="310" width="150" height="112" rx="8" class="bx-tor"/>
          <text x="967" y="348" class="t-sm mid f-tor">Rendezvous</text>
          <text x="967" y="376" class="t-xxs mid f-t2">+ 3 hops from</text>
          <text x="967" y="398" class="t-xxs mid f-t2">the service side</text>

          <!-- tor daemon out to the guard: routed below the e-ink box, clear of it -->
          <path d="M 426 467 L 662 467 L 662 286 L 702 286" class="ln-tor" fill="none" marker-end="url(#s5p)"/>
          <line x1="860" y1="298" x2="884" y2="330" class="ln-tor" marker-end="url(#s5p)"/>
          <line x1="860" y1="430" x2="884" y2="400" class="ln-tor" marker-end="url(#s5p)"/>
          <line x1="1042" y1="366" x2="1098" y2="366" class="ln-tor" marker-end="url(#s5p)"/>

          <rect x="1126" y="302" width="100" height="128" rx="8" class="bx-o"/>
          <text x="1176" y="342" class="t-sm mid f-t">mempool</text>
          <text x="1176" y="366" class="t-sm mid f-t">.onion</text>
          <text x="1176" y="396" class="t-xxs mid f-lan">sees a</text>
          <text x="1176" y="416" class="t-xxs mid f-lan">circuit</text>

          <!-- kept inside the LAN zone: the split happens on the Pi, and this
               avoids straddling the zone borders -->
          <rect x="62" y="552" width="558" height="116" rx="8" class="bx-tor"/>
          <text x="86" y="584" class="t-xs f-tor" font-weight="700">WHY THE SPLIT MATTERS</text>
          <text x="86" y="614" class="t-xxs f-t">Tor refuses private addresses, so routing everything through</text>
          <text x="86" y="638" class="t-xxs f-t">the proxy would break Bitaxe polling.</text>
          <text x="86" y="660" class="t-xxs f-t">Scope it to the mempool host, not the whole process.</text>
        </svg>
