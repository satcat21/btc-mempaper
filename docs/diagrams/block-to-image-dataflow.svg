<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Block arrival sequence: the websocket pushes a new block, the block lock rejects duplicates, and a pre-rendered image already held in RAM reaches browsers in about one second. If no pre-render matches, a fresh render adds roughly fifteen to twenty seconds. In parallel, background threads push the e-ink panel over about thirty-five seconds, speculatively pre-render the next block, and rescan wallet balances.">
<style>
  svg { font-family: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }

  .f-t{fill:#1A1A1F} .f-t2{fill:#5C5C66} .f-t3{fill:#8A8A94}
  .f-btc{fill:#B7791F} .f-lan{fill:#1D6B2C} .f-auth{fill:#2C5AA8}
  .f-exp{fill:#C62828} .f-tor{fill:#6B3FA0}

  .zone{fill:none;stroke-width:1.5;stroke-dasharray:7 5}
  .zone-lan{fill:rgba(29,107,44,0.09);stroke:#1D6B2C}
  .zone-exp{fill:rgba(198,40,40,0.08);stroke:#C62828}
  .zone-net{fill:#F2F0EC;stroke:#DAD6CE}
  .zone-tor{fill:rgba(107,63,160,0.10);stroke:#6B3FA0}
  .zone-auth{fill:rgba(44,90,168,0.09);stroke:#2C5AA8}

  .bx{fill:#FFFFFF;stroke:#1A1A1F;stroke-width:1.6}
  .bx-soft{fill:#FFFFFF;stroke:#DAD6CE;stroke-width:1.6}
  .bx-2{fill:#F2F0EC;stroke:#DAD6CE;stroke-width:1.4}
  .bx-in{fill:#FFFFFF;stroke:#DAD6CE;stroke-width:1.2}
  .bx-btc{fill:rgba(183,121,31,0.10);stroke:#B7791F;stroke-width:2.4}
  .bx-lan{fill:rgba(29,107,44,0.09);stroke:#1D6B2C;stroke-width:1.9}
  .bx-auth{fill:rgba(44,90,168,0.09);stroke:#2C5AA8;stroke-width:2}
  .bx-exp{fill:rgba(198,40,40,0.08);stroke:#C62828;stroke-width:1.6}
  .bx-tor{fill:rgba(107,63,160,0.10);stroke:#6B3FA0;stroke-width:2.2}
  .bx-o{fill:#FFFFFF;stroke:#C62828;stroke-width:2}
  .bx-g{fill:#FFFFFF;stroke:#1D6B2C;stroke-width:2}

  .ln{stroke:#1A1A1F;stroke-width:2;fill:none}
  .ln-thin{stroke:#DAD6CE;stroke-width:1;fill:none}
  /* fill:none matters on every one of these: the bracket paths are open
     outlines, and without it a browser fills them solid black. */
  .ln-btc{stroke:#B7791F;stroke-width:2;fill:none}
  .ln-tor{stroke:#6B3FA0;stroke-width:2.4;fill:none}
  .ln-exp{stroke:#C62828;stroke-width:2.4;fill:none}
  .ln-auth{stroke:#2C5AA8;stroke-width:2.3;fill:none}
  .ln-lan{stroke:#1D6B2C;stroke-width:2.2;fill:none}
  .ln-mut{stroke:#5C5C66;stroke-width:2;fill:none}
  .ln-dash{stroke:#8A8A94;stroke-width:1.6;fill:none;stroke-dasharray:5 4}
  .ln-sep{stroke:#E8E5DF;stroke-width:1;fill:none}

  .t-lg{font-size:25px;font-weight:700} .t-md{font-size:20px;font-weight:600}
  .t-sm{font-size:17px;font-weight:600} .t-xs{font-size:15px} .t-xxs{font-size:14px}
  .t-zone{font-size:18px;font-weight:600;letter-spacing:1.5px}
  .t-eyebrow{font-size:15px;font-weight:700;letter-spacing:1.4px}
  .mid{text-anchor:middle}
</style>
<rect x="0" y="0" width="100%" height="100%" fill="#FAF9F6"/>
<svg x="40" y="20" width="44" height="44" viewBox="0 0 64 64"><g transform="translate(0.00630876,-0.00301984)"><path fill="#1a1a1f" d="m63.033,39.744c-4.274,17.143-21.637,27.576-38.782,23.301-17.138-4.274-27.571-21.638-23.295-38.78,4.272-17.145,21.635-27.579,38.775-23.305,17.144,4.274,27.576,21.64,23.302,38.784z"/><path fill="#F7931A" d="m46.103,27.444c0.637-4.258-2.605-6.547-7.038-8.074l1.438-5.768-3.511-0.875-1.4,5.616c-0.923-0.23-1.871-0.447-2.813-0.662l1.41-5.653-3.509-0.875-1.439,5.766c-0.764-0.174-1.514-0.346-2.242-0.527l0.004-0.018-4.842-1.209-0.934,3.75s2.605,0.597,2.55,0.634c1.422,0.355,1.679,1.296,1.636,2.042l-1.638,6.571c0.098,0.025,0.225,0.061,0.365,0.117-0.117-0.029-0.242-0.061-0.371-0.092l-2.296,9.205c-0.174,0.432-0.615,1.08-1.609,0.834,0.035,0.051-2.552-0.637-2.552-0.637l-1.743,4.019,4.569,1.139c0.85,0.213,1.683,0.436,2.503,0.646l-1.453,5.834,3.507,0.875,1.439-5.772c0.958,0.26,1.888,0.5,2.798,0.726l-1.434,5.745,3.511,0.875,1.453-5.823c5.987,1.133,10.489,0.676,12.384-4.739,1.527-4.36-0.076-6.875-3.226-8.515,2.294-0.529,4.022-2.038,4.483-5.155zm-8.022,11.249c-1.085,4.36-8.426,2.003-10.806,1.412l1.928-7.729c2.38,0.594,10.012,1.77,8.878,6.317zm1.086-11.312c-0.99,3.966-7.1,1.951-9.082,1.457l1.748-7.01c1.982,0.494,8.365,1.416,7.334,5.553z"/></g></svg>
<text x="96" y="42" font-size="21" font-weight="700"><tspan fill="#1A1A1F">mem</tspan><tspan fill="#B7791F">paper</tspan></text>
<text x="96" y="64" font-size="15" fill="#5C5C66">New block to rendered image</text>
<text x="1240" y="42" font-size="13" fill="#8A8A94" text-anchor="end">github.com/satcat21/btc-mempaper</text>
<text x="1240" y="63" font-size="13" fill="#8A8A94" text-anchor="end">2026</text>
<line x1="40" y1="80" x2="1240" y2="80" stroke="#DAD6CE" stroke-width="1"/>

          <defs>
            <marker id="m6t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-t"/></marker>
            <marker id="m6g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-lan"/></marker>
            <marker id="m6o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-btc"/></marker>
            <marker id="m6d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-t3"/></marker>
          </defs>

          <line x1="80" y1="118" x2="1220" y2="118" class="ln-thin"/>
          <text x="86" y="106" class="t-xxs f-t3">t = 0</text>
          <text x="404" y="106" class="t-xxs f-t3">+0.2 s</text>
          <text x="712" y="106" class="t-xxs f-t3">~1 s</text>
          <text x="1030" y="106" class="t-xxs f-t3">browser updated</text>

          <rect x="80" y="146" width="240" height="112" rx="8" class="bx" stroke-width="1.8"/>
          <text x="200" y="182" class="t-sm mid f-t" font-size="18">WSS pushes</text>
          <text x="200" y="208" class="t-sm mid f-t" font-size="18">new block</text>
          <text x="200" y="234" class="t-xxs mid f-t2">height + hash</text>

          <rect x="380" y="146" width="240" height="112" rx="8" class="bx" stroke-width="1.8"/>
          <text x="500" y="182" class="t-sm mid f-t" font-size="18">block lock</text>
          <text x="500" y="208" class="t-xxs mid f-t2">height &gt; current?</text>
          <text x="500" y="234" class="t-xxs mid f-t2">drops duplicates</text>

          <rect x="680" y="146" width="264" height="112" rx="8" class="bx-btc" stroke-width="2.2"/>
          <text x="812" y="182" class="t-sm mid f-btc" font-size="18">pre-render hit</text>
          <text x="812" y="208" class="t-xxs mid f-t">image already in RAM</text>
          <text x="812" y="234" class="t-xxs mid f-t">nothing to compute</text>

          <rect x="1004" y="146" width="216" height="112" rx="8" class="bx-lan" stroke-width="2"/>
          <text x="1112" y="182" class="t-sm mid f-t" font-size="18">Browsers</text>
          <text x="1112" y="208" class="t-xxs mid f-t2">new_image event</text>
          <text x="1112" y="234" class="t-xxs mid f-lan">~1 s total</text>

          <line x1="320" y1="202" x2="372" y2="202" class="ln" marker-end="url(#m6t)"/>
          <line x1="620" y1="202" x2="672" y2="202" class="ln" marker-end="url(#m6t)"/>
          <line x1="944" y1="202" x2="996" y2="202" class="ln-lan" marker-end="url(#m6g)"/>

          <rect x="680" y="292" width="264" height="82" rx="8" class="bx-soft" stroke-dasharray="6 4"/>
          <text x="812" y="322" class="t-xs mid f-t2" font-weight="600">miss → render now</text>
          <text x="812" y="348" class="t-xxs mid f-t3">adds ~15–20 s first</text>
          <line x1="812" y1="258" x2="812" y2="286" class="ln-dash" marker-end="url(#m6d)"/>
          <path d="M 944 333 L 1112 333 L 1112 266" class="ln-dash" marker-end="url(#m6d)"/>

          <!-- Header sits ABOVE the bracket. Previously the fan-out arrows ran
               from y=396 down to the boxes, straight through this text and the
               rule beneath it; the whole assembly now starts below both. -->
          <text x="90" y="374" class="t-xxs f-btc">fan-out — none of these block the browser</text>
          <text x="80" y="400" class="t-eyebrow f-t3">MEANWHILE — BACKGROUND THREADS, ALL IN PARALLEL</text>

          <!-- Steps aside before descending: the dashed "miss" box is centred on
               x=812 too, so a straight drop ran through its text. -->
          <path d="M 812 266 L 812 280 L 660 280 L 660 418" class="ln-btc" stroke-width="1.6" fill="none"/>
          <path d="M 256 426 L 256 418 L 1034 418 L 1034 426" class="ln-btc" stroke-width="1.6"/>
          <path d="M 640 418 L 640 426" class="ln-btc" stroke-width="1.6"/>
          <line x1="256" y1="426" x2="256" y2="456" class="ln-btc" stroke-width="1.8" marker-end="url(#m6o)"/>
          <line x1="640" y1="426" x2="640" y2="456" class="ln-btc" stroke-width="1.8" marker-end="url(#m6o)"/>
          <line x1="1034" y1="426" x2="1034" y2="456" class="ln-btc" stroke-width="1.8" marker-end="url(#m6o)"/>

          <rect x="80" y="462" width="352" height="132" rx="8" class="bx" stroke-width="1.8"/>
          <text x="256" y="496" class="t-sm mid f-t" font-size="18">e-ink push</text>
          <text x="256" y="524" class="t-xxs mid f-t2">worker: init → display → sleep</text>
          <text x="256" y="550" class="t-xxs mid f-t2">~35 s · non-blocking lock</text>
          <text x="256" y="578" class="t-xxs mid f-btc">block mid-refresh → queued once</text>

          <rect x="464" y="462" width="352" height="132" rx="8" class="bx" stroke-width="1.8"/>
          <text x="640" y="496" class="t-sm mid f-t" font-size="18">pre-render next block</text>
          <text x="640" y="524" class="t-xxs mid f-t2">renders height + 1 speculatively</text>
          <text x="640" y="550" class="t-xxs mid f-t2">placeholder hash, real data</text>
          <text x="640" y="578" class="t-xxs mid f-lan">this is what makes the next hit ~1 s</text>

          <rect x="848" y="462" width="372" height="132" rx="8" class="bx" stroke-width="1.8"/>
          <text x="1034" y="496" class="t-sm mid f-t" font-size="18">wallet + reward scan</text>
          <text x="1034" y="524" class="t-xxs mid f-t2">derive addresses locally</text>
          <text x="1034" y="550" class="t-xxs mid f-t2">query balances · scan coinbase</text>
          <text x="1034" y="578" class="t-xxs mid f-t2">pushes its own socket event</text>

          <rect x="80" y="624" width="1140" height="58" rx="8" class="bx-btc" stroke-width="1.6"/>
          <text x="104" y="660" class="t-xs f-t" font-size="16"><tspan class="f-btc" font-weight="700">The trick:</tspan> the image for block N+1 is rendered before block N+1 exists — so arrival is a cache lookup, not a render.</text>
        </svg>
