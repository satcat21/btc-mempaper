<rect x="0" y="0" width="100%" height="100%" fill="#FAF9F6"/>
<svg x="40" y="20" width="44" height="44" viewBox="0 0 64 64"><g transform="translate(0.00630876,-0.00301984)"><path fill="#1a1a1f" d="m63.033,39.744c-4.274,17.143-21.637,27.576-38.782,23.301-17.138-4.274-27.571-21.638-23.295-38.78,4.272-17.145,21.635-27.579,38.775-23.305,17.144,4.274,27.576,21.64,23.302,38.784z"/><path fill="#F7931A" d="m46.103,27.444c0.637-4.258-2.605-6.547-7.038-8.074l1.438-5.768-3.511-0.875-1.4,5.616c-0.923-0.23-1.871-0.447-2.813-0.662l1.41-5.653-3.509-0.875-1.439,5.766c-0.764-0.174-1.514-0.346-2.242-0.527l0.004-0.018-4.842-1.209-0.934,3.75s2.605,0.597,2.55,0.634c1.422,0.355,1.679,1.296,1.636,2.042l-1.638,6.571c0.098,0.025,0.225,0.061,0.365,0.117-0.117-0.029-0.242-0.061-0.371-0.092l-2.296,9.205c-0.174,0.432-0.615,1.08-1.609,0.834,0.035,0.051-2.552-0.637-2.552-0.637l-1.743,4.019,4.569,1.139c0.85,0.213,1.683,0.436,2.503,0.646l-1.453,5.834,3.507,0.875,1.439-5.772c0.958,0.26,1.888,0.5,2.798,0.726l-1.434,5.745,3.511,0.875,1.453-5.823c5.987,1.133,10.489,0.676,12.384-4.739,1.527-4.36-0.076-6.875-3.226-8.515,2.294-0.529,4.022-2.038,4.483-5.155zm-8.022,11.249c-1.085,4.36-8.426,2.003-10.806,1.412l1.928-7.729c2.38,0.594,10.012,1.77,8.878,6.317zm1.086-11.312c-0.99,3.966-7.1,1.951-9.082,1.457l1.748-7.01c1.982,0.494,8.365,1.416,7.334,5.553z"/></g></svg>
<text x="96" y="42" font-size="21" font-weight="700"><tspan fill="#1A1A1F">mem</tspan><tspan fill="#B7791F">paper</tspan></text>
<text x="96" y="64" font-size="15" fill="#5C5C66">How WebSockets survive onion routing</text>
<text x="1240" y="42" font-size="13" fill="#8A8A94" text-anchor="end">github.com/satcat21/btc-mempaper</text>
<text x="1240" y="63" font-size="13" fill="#8A8A94" text-anchor="end">2026</text>
<line x1="40" y1="80" x2="1240" y2="80" stroke="#DAD6CE" stroke-width="1"/>

          <defs>
            <marker id="s8t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-t"/></marker>
          </defs>

          <rect x="60" y="104" width="1160" height="128" rx="9" class="bx-tor"/>
          <text x="86" y="140" class="t-md f-tor">The short answer</text>
          <text x="86" y="176" class="t-xs f-t">Tor forwards <tspan font-weight="700">arbitrary TCP streams</tspan>. A WebSocket is a single long-lived TCP connection that began as an HTTP request</text>
          <text x="86" y="204" class="t-xs f-t">and got upgraded. Tor never inspects that — it moves bytes. Nothing about WSS is special to it.</text>

          <text x="60" y="286" class="t-eyebrow f-t3">THE THREE THINGS THAT ACTUALLY MATTER</text>
          <line x1="60" y1="300" x2="1220" y2="300" class="ln-sep"/>

          <rect x="60" y="324" width="368" height="230" rx="9" class="bx"/>
          <text x="86" y="360" class="t-sm f-t">1 · Name resolution</text>
          <text x="86" y="394" class="t-xxs f-t2">Your OS cannot resolve a .onion</text>
          <text x="86" y="418" class="t-xxs f-t2">name — only Tor can.</text>
          <rect x="86" y="436" width="316" height="40" rx="5" class="bx-2"/>
          <text x="102" y="462" class="t-xxs f-tor">proxy_type = "socks5h"</text>
          <text x="86" y="502" class="t-xxs f-t">The <tspan font-weight="700">h</tspan> hands the hostname to the</text>
          <text x="86" y="526" class="t-xxs f-t">proxy. Plain "socks5" resolves</text>
          <text x="86" y="548" class="t-xxs f-exp">locally and fails.</text>

          <rect x="456" y="324" width="368" height="230" rx="9" class="bx"/>
          <text x="482" y="360" class="t-sm f-t">2 · Circuit rotation</text>
          <text x="482" y="394" class="t-xxs f-t2">Tor rotates circuits about every</text>
          <text x="482" y="418" class="t-xxs f-t2">10 minutes — a common worry.</text>
          <rect x="482" y="436" width="316" height="40" rx="5" class="bx-lan"/>
          <text x="498" y="462" class="t-xxs f-lan">applies to NEW streams only</text>
          <text x="482" y="502" class="t-xxs f-t">An established stream stays on</text>
          <text x="482" y="526" class="t-xxs f-t">its circuit. Your WebSocket is</text>
          <text x="482" y="548" class="t-xxs f-t">never torn down on a timer.</text>

          <rect x="852" y="324" width="368" height="230" rx="9" class="bx"/>
          <text x="878" y="360" class="t-sm f-t">3 · Relays do fail</text>
          <text x="878" y="394" class="t-xxs f-t2">A relay going offline kills the</text>
          <text x="878" y="418" class="t-xxs f-t2">circuit, and the socket with it.</text>
          <rect x="878" y="436" width="316" height="40" rx="5" class="bx-btc"/>
          <text x="894" y="462" class="t-xxs f-btc">already handled — 30 s retry</text>
          <text x="878" y="502" class="t-xxs f-t">block_monitor reconnects on a</text>
          <text x="878" y="526" class="t-xxs f-t">fixed 30 s backoff. A dropped</text>
          <text x="878" y="548" class="t-xxs f-t">circuit self-heals.</text>

          <rect x="60" y="586" width="1160" height="106" rx="9" class="bx-2"/>
          <text x="86" y="620" class="t-xs f-t2" font-weight="700">WORST CASE, CONCRETELY</text>
          <text x="86" y="650" class="t-xs f-t">A circuit dies just as a block lands: mempaper misses that push and reconnects within 30 s. The dashboard is stale until the</text>
          <text x="86" y="676" class="t-xs f-t">next block — the same failure mode as any brief network blip, which the app already survives today.</text>
        </svg>
