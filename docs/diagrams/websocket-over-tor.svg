<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="WebSocket over Tor mechanism. Tor forwards arbitrary TCP streams and a WebSocket is one long-lived TCP connection after its HTTP upgrade, so Tor carries it unchanged. Three practical points: socks5h is required so the onion hostname resolves at the proxy; Tor's ten-minute circuit rotation applies only to new streams so an established WebSocket is never forcibly rotated; and if a relay drops, the existing thirty-second reconnect loop rebuilds the circuit.">
